spring.application.name=TvmResourceManagement
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/tvm_resource_management
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

app.security.admin.email=${ADMIN_EMAIL:admin@company.com}
app.security.admin.password=${ADMIN_PASSWORD:admin123}
app.security.admin.employee-code=${ADMIN_EMP_CODE:ADM001}
app.security.admin.first-name=System
app.security.admin.last-name=Admin
app.security.admin.phone=9999999999