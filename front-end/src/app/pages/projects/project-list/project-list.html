<div class="project-page">

  <div class="page-header">

    <div>
      <h1>Projects</h1>
      <p>Manage projects and their resources</p>
    </div>

    <button
      class="add-button"
      routerLink="/projects/add">
      + Add Project
    </button>

  </div>

  <div class="table-container">

    <table>

      <thead>
        <tr>
          <th>Project Name</th>
          <th>Description</th>
          <th>Manager</th>
          <th>Start Date</th>
          <th>End Date</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody>

        @for (project of projects; track project.id) {

          <tr>

            <td>{{ project.name }}</td>

            <td>{{ project.description }}</td>

            <td>{{ project.manager }}</td>

            <td>{{ project.startDate }}</td>

            <td>{{ project.endDate }}</td>

            <td>
              <span
                class="status"
                [class.active]="project.status === 'Active'"
                [class.completed]="project.status === 'Completed'">
                {{ project.status }}
              </span>
            </td>

            <td class="actions">

              <button
                [routerLink]="['/projects', project.id]">
                View
              </button>

              <button
                [routerLink]="['/projects/edit', project.id]">
                Edit
              </button>

            </td>

          </tr>

        }

      </tbody>

    </table>

  </div>

</div>
