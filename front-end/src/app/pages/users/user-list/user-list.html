<div class="user-page">

    <div class="page-header">
        <div>
            <h1>Users</h1>
            <p>Manage employees and their access</p>
        </div>

        <button class="add-button" routerLink="/users/add">
            + Add User
        </button>
    </div>

    <div class="filters">

        <input type="text" [(ngModel)]="searchText" placeholder="Search by name or email" />

        <select [(ngModel)]="selectedRole">
            <option value="All">All Roles</option>
            <option value="EMPLOYEE">Employee</option>
            <option value="PROJECT_LEAD">Project Lead</option>
            <option value="ADMIN">Admin</option>
            <option value="INVENTORY_MANAGER">Inventory Manager</option>
        </select>

    </div>

    <div class="table-container">

        <table>

            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>

                @for (user of filteredUsers; track user.id) {

                <tr>

                    <td>{{ user.firstName }} {{user.lastName}}</td>

                    <td>{{ user.email }}</td>

                    <td>{{ user.role }}</td>

                    <td>
                        <span class="status" [class.active]="user.status === 'Active'"
                            [class.inactive]="user.status === 'Inactive'">
                            {{ user.status }}
                        </span>
                    </td>

                    <td class="actions">
                        <button [routerLink]="['/users', user.id]">View</button>
                        <button [routerLink]="['/users/edit', user.id]">Edit</button>
                        <button (click)="toggleStatus(user.id)">
                            {{ user.status === 'Active' ? 'Disable' : 'Enable' }}
                        </button>
                    </td>

                </tr>

                }

            </tbody>

        </table>

    </div>

</div>
