<div class="app-layout">
    <app-header
        (menuClick)="toggleSidebar()">
    </app-header>

    <div class="body-layout">
        @if (sidebarOpen) {
            <div
                class="sidebar-overlay"
                (click)="closeSidebar()"
                aria-label="Close sidebar overlay">
            </div>
        }

        <app-sidebar
            [isOpen]="sidebarOpen"
            (menuItemClick)="closeSidebar()">
        </app-sidebar>

        <main class="main-content">
            <router-outlet></router-outlet>
        </main>
    </div>
</div>
